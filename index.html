<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>伦敦金主连金价跟踪工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="brand-lockup">
          <div class="gold-logo" aria-hidden="true">
            <span class="logo-mark">Au</span>
            <span class="logo-shine"></span>
          </div>
          <div>
            <p class="eyebrow">Gold Futures Monitor</p>
            <h1>伦敦金主连金价跟踪工具</h1>
          </div>
        </div>
        <div class="hero-panel">
          <span id="dataStatus">正在加载市场数据...</span>
          <button id="refreshBtn" type="button">刷新</button>
        </div>
      </section>

      <section class="metric-grid" id="metricGrid"></section>

      <section class="workspace">
        <aside class="sidebar">
          <div class="panel compact">
            <h2>信号仪表</h2>
            <div class="signal">
              <div class="signal-ring" id="signalRing">--</div>
              <div>
                <strong id="signalLabel">等待数据</strong>
                <span id="signalText">完成加载后生成本地量化信号</span>
              </div>
            </div>
            <div class="score-lines" id="scoreLines"></div>
          </div>

          <div class="panel compact">
            <h2>核心读数</h2>
            <dl class="readout" id="readout"></dl>
          </div>
        </aside>

        <section class="chart-stack">
          <div class="panel">
            <div class="panel-title">
              <h2>金价近三年走势</h2>
              <span id="goldSource">GC=F</span>
            </div>
            <canvas id="goldChart" height="260"></canvas>
          </div>

          <div class="two-col">
            <div class="panel">
              <div class="panel-title">
                <h2>20日已实现波动率</h2>
                <span>年化 · 近三年</span>
              </div>
              <canvas id="rvChart" height="220"></canvas>
            </div>
            <div class="panel">
              <div class="panel-title">
                <h2>GVZ 隐含波动率指数</h2>
                <span id="gvzSource">FRED GVZCLS · 与金价交易日对齐</span>
              </div>
              <canvas id="gvzChart" height="220"></canvas>
            </div>
          </div>

          <div class="panel">
            <div class="panel-title">
              <h2>金铜比与金银比近三年走势</h2>
              <span>归一化展示</span>
            </div>
            <canvas id="ratioChart" height="260"></canvas>
          </div>

          <div class="panel">
            <div class="panel-title">
              <h2>美国宏观参考指标</h2>
              <span>FRED</span>
            </div>
            <div class="macro-grid" id="macroGrid"></div>
          </div>
        </section>
      </section>

      <footer>
        数据源：东方财富 COMEX 主连日线、FRED CSV。页面输出仅用于研究，不构成投资建议。
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
